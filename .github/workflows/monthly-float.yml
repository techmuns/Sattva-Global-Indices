# Monthly statistics refresh.
#
# WHAT MOVED OUT OF THIS JOB, AND WHY
#
# The float factor and the BSE scrip master used to be refreshed here, monthly,
# on the reasoning that "the factor moves only when shareholding moves, which is
# the quarterly event this product forecasts". That reasoning still holds for the
# DATA, and it stopped being the right cadence for the JOB: the desk now wants
# the record re-read from source every trading day, and the BSE scrape was
# measured at about seven minutes at concurrency 8 — cheap enough to do daily.
#
# So float, master, universe and prices all live in daily-refresh.yml now, and
# NSE additionally gets a patient weekly retry in weekly-nse-crosscheck.yml.
#
# WHAT IS LEFT HERE — three inputs whose right cadence is genuinely monthly:
#
#   1. Munshot's average daily volume. A nice-to-have on somebody else's rate-
#      limited service; nothing on the screen depends on it being fresh, and it
#      is SOFT for that reason.
#
#   2. BSE's corporate-action history. Bonuses and splits are announced weeks
#      ahead and a month's lag cannot miss one that has already gone ex. HARD:
#      a price series measured against stale action data reads a 1:1 bonus as a
#      50% collapse, which is a confident wrong number rather than an absence.
#
#   3. The per-stock closes across the two most recent CLOSED MSCI price
#      windows. Those windows change four times a year, so monthly is already
#      three times more often than it can matter — the step is idempotent and
#      simply picks up a new window the first run after one closes.
#
# The benchmark fetch was added here too. It is soft, but it must run: this job
# moves quote-stats' capture date forward, and every relative reading is a stock
# leg and an index leg struck on the SAME date. Leave the benchmark series
# behind and the index leg falls past the end of its own series, taking every
# reading in the universe to no-reading at once, silently, on a monthly run.
name: Monthly statistics refresh

on:
  schedule:
    # 20:30 UTC on the 1st is 02:00 IST on the SECOND — cron is evaluated in UTC
    # and this one crosses midnight. The job is monthly and nothing depends on
    # the calendar day, so the schedule stands; the arithmetic is stated here
    # because the comment used to claim the 1st and was wrong by a day.
    - cron: '30 20 1 * *' # 02:00 IST on the 2nd
  workflow_dispatch:

concurrency:
  group: monthly-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Statistics are a nice-to-have: this upstream reports "not_found" for
      # tickers it served minutes earlier when pushed, so the script refuses to
      # write below its coverage floor. A failure here must not block the float
      # refresh, which is the part that matters.
      - name: Munshot quote statistics (ADV, splits)
        continue-on-error: true
        env:
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: node scripts/fetch-quote-stats.mjs --concurrency 1 --gap-ms 1200

      # ---- the benchmark series must not fall behind the stats -------------
      # Every relative reading is a stock leg minus an index leg struck on the
      # SAME DATE. quote-stats' capture date is one of those anchors, and this
      # workflow moves it forward once a month. If the benchmark series is not
      # moved with it, the index leg's required date falls past the end of the
      # series and every reading goes to no-reading at once — on the monthly run,
      # silently, for the whole universe.
      #
      # It is soft here for the same reason it is soft in the daily refresh: a
      # Yahoo outage must not strand a month's float scrape that has already run.
      - name: Fund benchmark closes (soft)
        id: benchmarks
        continue-on-error: true
        # pipefail is load-bearing: without it the step's exit code is tee's, always 0,
        # and the 'if failure' branch below could never fire.
        run: |
          set -o pipefail
          node scripts/fetch-fund-benchmarks.mjs 2>&1 | tee /tmp/benchmarks.log

      - name: Say what actually stopped the benchmarks
        if: steps.benchmarks.outcome == 'failure'
        run: |
          REASON=$(grep -m1 -E 'Refusing to write|Could not read|REFUSING TO WRITE' /tmp/benchmarks.log \
                   || echo 'no reason line found — read the step log above')
          echo "::warning title=Benchmarks not written::${REASON}"
          echo "::warning title=What this means::the benchmark series now trails quote-stats' capture"\
               "date, so relative readings anchored on it will report a stated absence until the next"\
               "successful fetch."

      # ---- corporate actions, then the price windows ----------------------
      # ORDER MATTERS: the price history refuses to write without an actions
      # file beside it, because a raw close series with no action data reads a
      # 1:1 bonus as a 50% collapse. See CLAUDE.md 3.8.1.
      #
      # Both are HARD steps. A soft one here would leave the relative-performance
      # column measuring a window against stale action data, which is the one
      # combination that produces a confident wrong number rather than a stated
      # absence.
      - name: BSE corporate actions
        run: node scripts/fetch-corporate-actions.mjs

      # Idempotent by design: it always measures the two most recent CLOSED
      # review windows, so running it monthly re-confirms the same pair until a
      # new window closes and then picks it up with no change here. The next one
      # closes 30 Oct 2026.
      - name: Per-stock price history across the review windows
        run: node scripts/fetch-price-history.mjs

      - name: Rebuild the record
        run: node scripts/build-companies.mjs

      - name: Verify the record
        run: node scripts/verify-data.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No change in public/data — nothing to commit."
            exit 0
          fi
          git config user.name  "sattva-bot"
          git config user.email "tech@muns.io"
          git add public/data
          git commit -m "Monthly refresh: quote statistics, corporate actions, review-window prices"

          # REBASE AND RETRY, because a bare `git push` loses the whole run.
          #
          # This job holds the working tree for minutes at a time, and ANY push
          # to main inside that window
          # makes the final push non-fast-forward. Measured on 28 Aug 2026 in
          # daily-refresh.yml: the full pipeline ran clean end to end, committed,
          # and then threw all of it away on
          # `! [rejected] main -> main (fetch first)` because a commit had landed
          # while it worked. A human pushing during the evening window, or two
          # workflows overlapping, does this in ordinary operation.
          #
          # Rebasing is safe here specifically because this job only ever touches
          # public/data: it has no opinion about anything else on the branch, so
          # replaying its one commit onto whatever arrived cannot lose work.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} — someone pushed while this ran. Rebasing."
            sleep $((attempt * 5))
            git pull --rebase origin main || {
              echo "::error title=Rebase failed::public/data conflicts with origin/main. Resolve by hand."
              exit 1
            }
          done
          echo "::error title=Push failed::Five attempts, all rejected. The data is built and verified but not committed."
          exit 1
