# TEMPORARY on branch ftse-automation: feasibility probe for scripts/fetch-ftse.mjs.
# Reverted before review — the real step lives in daily-refresh.yml.
name: Probe NSE reachability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (globally, outside the repo)
        run: |
          npm install -g playwright@latest
          playwright install chromium
      - name: Fetch the Vanguard export, dry run
        run: |
          export NODE_PATH="$(npm root -g)"
          node scripts/fetch-ftse.mjs --dry-run
