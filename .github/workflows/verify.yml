# The verification suite, on every push and every pull request.
#
# THIS IS THE JOB THAT MAKES THE PREVIOUS FIVE PROMPTS DURABLE. Every trap
# found while building this repo — the sparse-cell shift, the ₹-crore
# parseFloat, the delisted scrip, the SPA shell served with HTTP 200, the
# self-exempting unit tripwire, the ₹0 Cr rounding, the superseded drill
# panel clearing its own URL — has a check here. A future change cannot quietly
# undo one of them without turning this red.
#
# TWO MODES, AND BOTH MATTER.
#
#   static   `python3 -m http.server` — no /api/quotes, so the live checks
#            report SKIP. That run is worth doing: it exercises the end-of-day
#            floor, which is the state the site is in most of the time.
#   worker   `npx wrangler dev` — the live checks must actually run, so the
#            job passes --require-live and a SKIP there becomes a failure.
#
# The worker job needs MUNS_TOKEN. Where the secret is absent — a fork, or a
# repository where it has not been configured — the job is SKIPPED AT JOB LEVEL
# and renders as "Skipped" in the checks list.
#
# THAT DISTINCTION IS THE WHOLE POINT, and the first run of this workflow got it
# wrong. Guarding each STEP with `if:` left the job itself reporting SUCCESS
# while every meaningful step inside it was skipped — a green tick for work that
# did not happen, which is precisely what this suite exists to prevent. The
# `secret` job below exists only to turn the secret's presence into an output,
# because the `secrets` context is not available in a job-level `if:`.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data (no browser, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No package.json and no dependencies — Node is used bare.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: There is no package.json and no node_modules in this repo
        run: |
          if find . -path ./.git -prune -o \( -name package.json -o -name node_modules \) -print | grep -q .; then
            echo "::error::a package.json or node_modules appeared — the no-dependency rule is broken"
            find . -path ./.git -prune -o \( -name package.json -o -name node_modules \) -print
            exit 1
          fi
          echo "clean: no package.json, no node_modules"

      - name: No credential may be committed
        run: |
          if git grep -nIE 'MUNS_TOKEN\s*=\s*["'"'"'][^"'"'"']{8,}|Bearer [A-Za-z0-9._-]{20,}' -- . ':!*.md'; then
            echo "::error::something that looks like a credential is committed"
            exit 1
          fi
          echo "clean: no credential-shaped strings"

      - name: verify-data
        run: node scripts/verify-data.mjs

      # Every check must still be capable of failing. A check that survives its
      # own sabotage is decoration, and this is the only thing that notices.
      - name: verify-data --prove (every check must fail on purpose)
        run: node scripts/verify-data.mjs --prove

      - name: The build must reproduce the committed record
        run: |
          cp public/data/companies.json /tmp/companies-committed.json
          cp public/data/relative-baselines.json /tmp/baselines-committed.json
          node scripts/build-companies.mjs
          node -e '
            const fs = require("fs");
            // BOTH files the build writes. relative-baselines.json is derived
            // from the same inputs by the same run, and the interface swaps
            // between it and the reading inline in companies.json — so a stale
            // copy would put one baseline’s numbers under another’s heading.
            for (const [name, committed, built] of [
              ["companies.json", "/tmp/companies-committed.json", "public/data/companies.json"],
              ["relative-baselines.json", "/tmp/baselines-committed.json", "public/data/relative-baselines.json"],
            ]) {
              const a = JSON.parse(fs.readFileSync(committed, "utf8"));
              const b = JSON.parse(fs.readFileSync(built, "utf8"));
              delete a.builtAt; delete b.builtAt;
              if (JSON.stringify(a) !== JSON.stringify(b)) {
                console.error(`::error::${name} does not reproduce from its inputs — re-run build-companies.mjs and commit the result`);
                process.exit(1);
              }
              console.log(`${name} reproduces exactly, apart from builtAt`);
            }
          '

  ui-static:
    name: Interface — static floor (live checks SKIP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright is a global tool here, never a dependency of this repo.
      # Playwright is a global tool here, never a dependency of this repo, so the
      # global CLI does the browser install too. Two things this deliberately
      # does NOT do:
      #
      #   `npx --yes playwright install` re-resolves and fetches a SECOND copy
      #   of the package before it starts — minutes of nothing on a cold runner.
      #
      #   `--with-deps` shells out to apt-get, which on ubuntu-latest hung for
      #   over fourteen minutes on the first two runs of this workflow. The
      #   runner image already carries the libraries Chromium needs, so the
      #   browser download alone is enough; if a future image drops them, the
      #   fallback below installs just those packages.
      - name: Install Playwright (globally, outside the repo)
        timeout-minutes: 10
        run: |
          npm install -g playwright@latest
          playwright install chromium
          # The launch probe must resolve the GLOBAL install, so it needs
          # NODE_PATH — without it `require('playwright')` throws
          # MODULE_NOT_FOUND and the probe fails for a reason that has nothing
          # to do with whether Chromium can launch.
          export NODE_PATH="$(npm root -g)"
          node -e "
            require('playwright').chromium.launch()
              .then((b) => b.close())
              .then(() => console.log('chromium launches'), (e) => {
                console.log('chromium did not launch:', String(e.message).split('\n')[0]);
                console.log('installing system deps, the slow path');
                require('child_process').execSync('playwright install-deps chromium', { stdio: 'inherit' });
              });
          "

      - name: Serve the static site
        run: |
          python3 -m http.server 8080 -d public &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/

      - name: git status must still be clean after serving
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: verify-ui (static)
        run: NODE_PATH="$(npm root -g)" node scripts/verify-ui.mjs http://127.0.0.1:8080

      - name: verify-ui --prove (every check must fail on purpose)
        run: NODE_PATH="$(npm root -g)" node scripts/verify-ui.mjs http://127.0.0.1:8080 --prove

  # Exists only to make the secret's presence readable from a job-level `if:`.
  secret:
    name: Is the upstream token configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: |
          if [ -z "$MUNS_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MUNS_TOKEN is not configured for this repository, so the live block cannot be exercised. The Worker job will show as SKIPPED, not as passing. Add the secret to run it."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  ui-worker:
    name: Interface — Worker (--require-live, a SKIP is a failure)
    needs: secret
    # Skipped at JOB level, so the checks list reads "Skipped" rather than a
    # green tick over work that did not happen.
    if: needs.secret.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright is a global tool here, never a dependency of this repo, so the
      # global CLI does the browser install too. Two things this deliberately
      # does NOT do:
      #
      #   `npx --yes playwright install` re-resolves and fetches a SECOND copy
      #   of the package before it starts — minutes of nothing on a cold runner.
      #
      #   `--with-deps` shells out to apt-get, which on ubuntu-latest hung for
      #   over fourteen minutes on the first two runs of this workflow. The
      #   runner image already carries the libraries Chromium needs, so the
      #   browser download alone is enough; if a future image drops them, the
      #   fallback below installs just those packages.
      - name: Install Playwright (globally, outside the repo)
        timeout-minutes: 10
        run: |
          npm install -g playwright@latest
          playwright install chromium
          # The launch probe must resolve the GLOBAL install, so it needs
          # NODE_PATH — without it `require('playwright')` throws
          # MODULE_NOT_FOUND and the probe fails for a reason that has nothing
          # to do with whether Chromium can launch.
          export NODE_PATH="$(npm root -g)"
          node -e "
            require('playwright').chromium.launch()
              .then((b) => b.close())
              .then(() => console.log('chromium launches'), (e) => {
                console.log('chromium did not launch:', String(e.message).split('\n')[0]);
                console.log('installing system deps, the slow path');
                require('child_process').execSync('playwright install-deps chromium', { stdio: 'inherit' });
              });
          "

      # ⚠ A STEP `env:` DOES NOT REACH THE WORKER, AND THE COMMENT HERE SAID IT DID
      #
      # This read "the secret reaches the Worker through the environment, never a
      # file", set MUNS_TOKEN in the step's env, and started wrangler. The token
      # reaches the wrangler PROCESS that way and stops there: under
      # `wrangler dev --local` the Worker's `env` bindings come from
      # wrangler.jsonc `vars`, from `.dev.vars`, or from `--var`. The host
      # process environment is not injected as a binding, so `env.MUNS_TOKEN`
      # was undefined and /api/quotes answered `no-token` — its own name for
      # "nobody configured me".
      #
      # It was invisible because this job is gated on the secret existing, so it
      # had never run. The first time it did, on 22 Sep 2026, it reported:
      #
      #   envelope said "no-token": MUNS_TOKEN is not configured on this Worker
      #
      # which is the Worker being exactly honest about a state the workflow put
      # it in. `--var` is the other option and is wrong for a secret: it is a
      # plain-text var and wrangler prints its bindings on startup, straight into
      # a public build log. `.dev.vars` is the mechanism CLAUDE.md §5 already
      # names for precisely this, it is gitignored, and it is removed below
      # whatever the outcome.
      - name: Start wrangler dev
        env:
          MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
        run: |
          # printf with the value as an argument to a SHELL BUILTIN, not to an
          # external command, so it never appears in a process listing; '%s'
          # keeps it exact and umask 077 keeps the file to this user.
          umask 077
          printf 'MUNS_TOKEN=%s\n' "$MUNS_TOKEN" > .dev.vars
          npx --yes wrangler@latest dev --port 8787 --ip 127.0.0.1 --local &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:8787/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health

      # The Worker must actually be holding the token, not merely be running.
      # /api/health reports it without ever echoing the value, and a false here
      # means the live block is about to test the no-token path and call it live.
      - name: The Worker must be holding the token
        run: |
          CONFIGURED=$(curl -fsS http://127.0.0.1:8787/api/health \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).tokenConfigured===true)}catch{console.log('false')}})")
          if [ "$CONFIGURED" != "true" ]; then
            echo "::error title=The Worker has no token::/api/health reports tokenConfigured=false, so /api/quotes will answer"\
                 "'no-token' and the live block would be testing the unconfigured path while calling itself live."\
                 "Check that the MUNS_TOKEN repository secret exists and that .dev.vars was written above."
            exit 1
          fi
          echo "the Worker reports tokenConfigured=true"

      - name: verify-ui --require-live
        run: NODE_PATH="$(npm root -g)" node scripts/verify-ui.mjs http://127.0.0.1:8787 --require-live

      # Assertion 39 can only be proved where a Worker is answering — in the
      # static job it skips, and a skipped check is never proved. This is the
      # only run that can hold it to the same standard as the rest.
      - name: verify-ui --prove (the live block included)
        run: NODE_PATH="$(npm root -g)" node scripts/verify-ui.mjs http://127.0.0.1:8787 --prove

      # Always, so a failure above cannot leave a token on the runner's disk for
      # whatever runs next. `.dev.vars` is gitignored, so it never shows in
      # `git status --porcelain` and the check below cannot catch it for us.
      - name: Remove the local secret file
        if: always()
        run: rm -f .dev.vars

      - name: The token must not have reached the repo or the served site
        run: |
          if [ -f .dev.vars ]; then echo "::error::.dev.vars survived the run"; exit 1; fi
          test -z "$(git status --porcelain)" || { echo "::error::the run left files behind"; git status --porcelain; exit 1; }
          if grep -rq "MUNS_TOKEN" public/; then
            echo "::error::public/ names the token"
            exit 1
          fi
          echo "clean: nothing written, nothing leaked"
