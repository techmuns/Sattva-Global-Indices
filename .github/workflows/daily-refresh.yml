# The daily refresh: every source, re-read after the close, every trading day.
#
# ---------------------------------------------------------------------------
# WHY DAILY DIRECT FROM SOURCE, AND NOT A PRICE-ONLY RECOMPUTE
# ---------------------------------------------------------------------------
# The desk asked for daily-from-source if the workload allows it, and a
# price-driven recompute with a weekly cross-check if it does not. It allows it.
# Measured on 20 Aug 2026, the whole pipeline end to end:
#
#     import-universe        0.2 s   no network
#     fetch-bse-master       5.5 s   1 request
#     fetch-nse-universe    22.8 s   2 requests
#     scrape-nse-freefloat   ~2 min  4 requests, THROTTLES — see below
#     scrape-bse-freefloat   ~7 min  ~3,600 requests at concurrency 8
#     fetch-bhavcopy         ~2 s    1 request
#     build-companies        ~4 s    no network
#
# Well inside a single job. The BSE endpoint was measured at concurrency 24 with
# FLAT per-request latency and zero failures, so 8 is comfortably below what the
# service will carry — see the note in scrape-bse-freefloat.mjs.
#
# ---------------------------------------------------------------------------
# NSE IS SOFT ON PURPOSE. IT IS THE ONE SOURCE THAT CANNOT BE RELIED ON DAILY.
# ---------------------------------------------------------------------------
# NSE's edge throttles a datacentre IP hard and unpredictably: a paired trial on
# 20 Aug 2026 got HTTP 200 on 5 of 8 identical curl requests, and the first full
# pipeline run failed at `FO  HTTP 403 after 6 retries`.
#
# That is survivable, because the free-float FACTOR barely moves — 814 of 1,199
# companies were byte-identical day over day, 1,194 moved less than 0.1%, median
# movement 0.000000%. So a missed NSE day costs almost nothing, while a BSE
# outage would leave the screen without its primary source.
#
# The NSE steps therefore `continue-on-error`. The scraper REFUSES to overwrite a
# good snapshot with a partial read, so a throttled day leaves the last good NSE
# file in place and the build carries on with it. weekly-nse-crosscheck.yml
# retries with far more patience once a week.
#
# Everything else is hard: a failure there stops the job rather than committing a
# degraded file. A dashboard serving yesterday's numbers under today's date is
# worse than one that visibly failed.
name: Daily refresh

on:
  schedule:
    # 14:30 UTC = 20:00 IST, comfortably after the 15:30 IST close and after BSE
    # has published the day's bhavcopy. Mon–Fri.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Trade date to fetch (YYYY-MM-DD). Blank = latest weekday.'
        required: false
      skip-float:
        description: 'Skip the BSE float scrape (prices only). "true" to skip.'
        required: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # No package.json and no dependencies — Node is used bare.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- identity and universe ----------------------------------------
      - name: BSE scrip master
        run: node scripts/fetch-bse-master.mjs

      - name: Import the desk's universe seed
        run: node scripts/import-universe.mjs

      # ---- NSE: attempted every day, never allowed to stop the job -------
      - name: NSE symbol ↔ ISIN universe (soft)
        continue-on-error: true
        run: node scripts/fetch-nse-universe.mjs

      - name: NSE pre-open free float (soft — NSE throttles datacentre IPs)
        id: nse
        continue-on-error: true
        run: node scripts/scrape-nse-freefloat.mjs

      - name: Say so when NSE was unreachable
        if: steps.nse.outcome == 'failure'
        run: |
          echo "::warning title=NSE step failed::The NSE step did not complete. The previous"\
               "nse-freefloat.json is unchanged and the build continues on it."\
               "CHECK THE REASON IN THE STEP LOG BEFORE ASSUMING A THROTTLE: this warning used to"\
               "say 'NSE throttled this run', and for nine days it was wrong — NSE answered fine"\
               "and a shrink guard was refusing to write. A warning that names the wrong cause is"\
               "worse than none, because it stops anyone looking."

      # ---- BSE: the primary source. Hard. --------------------------------
      - name: BSE per-scrip free float
        if: github.event.inputs.skip-float != 'true'
        run: node scripts/scrape-bse-freefloat.mjs

      # ---- how the segments themselves moved ------------------------------
      # Yahoo, not an exchange, and not on the critical path: without it the
      # desk's rupee bands simply stand raw and every rule says so. That is a
      # less precise verdict, not a wrong one, so it must not fail the run.
      - name: Fund benchmark closes (soft)
        id: benchmarks
        continue-on-error: true
        run: node scripts/fetch-fund-benchmarks.mjs

      - name: Say so when the benchmarks were unreachable
        if: steps.benchmarks.outcome == 'failure'
        run: |
          echo "::warning title=Benchmarks unreachable::Yahoo did not answer. The previous"\
               "fund-benchmarks.json is unchanged and the bands are floated by whatever it"\
               "last recorded. If it is missing entirely the bands stand raw and every rule says so."

      # ---- prices, then the record ---------------------------------------
      - name: BSE end-of-day prices
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/fetch-bhavcopy.mjs --date "${{ github.event.inputs.date }}"
          else
            node scripts/fetch-bhavcopy.mjs
          fi

      - name: Rebuild the company record
        run: node scripts/build-companies.mjs

      # The suite runs BEFORE the commit, so a record that breaks an invariant
      # never reaches the repository. It needs no browser and no network.
      - name: Verify the record
        run: node scripts/verify-data.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/data; then
            echo "No change in public/data — nothing to commit."
            exit 0
          fi
          git config user.name  "sattva-bot"
          git config user.email "tech@muns.io"
          TRADE_DATE=$(node -e "console.log(require('./public/data/prices.json').tradeDate)")
          git add public/data
          git commit -m "Daily refresh for ${TRADE_DATE}"

          # REBASE AND RETRY, because a bare `git push` loses the whole run.
          #
          # This job holds the working tree for several minutes (the BSE float
          # scrape alone is ~7 of them), and ANY push to main inside that window
          # makes the final push non-fast-forward. Measured on 28 Aug 2026: the
          # full pipeline ran clean end to end — master, NSE, float, prices,
          # rebuild, verify — committed, and then threw all of it away on
          # `! [rejected] main -> main (fetch first)` because a commit had landed
          # while it worked. A human pushing during the evening window, or two
          # workflows overlapping, does this in ordinary operation.
          #
          # Rebasing is safe here specifically because this job only ever touches
          # public/data: it has no opinion about anything else on the branch, so
          # replaying its one commit onto whatever arrived cannot lose work.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt} — someone pushed while this ran. Rebasing."
            sleep $((attempt * 5))
            git pull --rebase origin main || {
              echo "::error title=Rebase failed::public/data conflicts with origin/main. Resolve by hand."
              exit 1
            }
          done
          echo "::error title=Push failed::Five attempts, all rejected. The data is built and verified but not committed."
          exit 1
